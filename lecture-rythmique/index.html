<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture Rythmique Express — NOTALIX by FM</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="../notalix-theme.css"><script defer src="../notalix-shell.js"></script></head><body><main><h1>Lecture Rythmique Express</h1><section class="section"><div id="home" class="screen show"><p class="mini">Lis le rythme et frappe chaque attaque sur le gros bouton ou la barre d’espace.</p><h2>Choisis ton niveau</h2><div class="grid"><div class="card" data-level="1"><strong>Niveau 1</strong>Noires, tempo lent</div><div class="card" data-level="2"><strong>Niveau 2</strong>Noires et croches</div><div class="card" data-level="3"><strong>Niveau 3</strong>Silences et doubles</div><div class="card" data-level="4"><strong>Niveau 4</strong>Rythmes pointés</div></div><button id="start" class="red" disabled>On y va 🚀</button></div><div id="game" class="screen"><div class="topbar"><button id="back" class="gray">← Choix du niveau</button><span id="count" class="pill"></span></div><div class="hud"><span id="score" class="pill">Score 0</span><div class="progress"><span id="bar"></span></div></div><div class="staff"><div id="rhythm" class="rhythm"></div><div id="cursor" class="cursor"></div></div><p id="tempo" class="pill"></p><button id="launch">▶ Départ (4 pulsations)</button><div><button id="tap" class="tap" disabled>FRAPPE !</button></div><div id="hits" class="hits"></div><div id="feedback" class="feedback"></div><button id="next" class="red hidden">Rythme suivant 🚀</button></div><div id="results" class="screen"><h2>Résultat</h2><div id="result" class="result"></div><p id="message"></p><button id="again">Rejouer</button><button id="homeBtn" class="red">Choisir un autre niveau</button></div></section></main><script src="app.js"></script></body></html>
