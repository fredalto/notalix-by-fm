<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Défi Sol</title>
  <link rel="stylesheet" href="unified.css">
  <style>
    .note img { max-width: 100px; height: auto; margin: 10px; }
    .note { display: inline-block; text-align: center; margin: 10px; }
    #feedback { font-size: 24px; font-weight: bold; margin-top: 20px; min-height: 40px; transition: color 0.3s ease; }
    #feedback.correct { color: green; }
    #feedback.incorrect { color: red; }
    #progress-container { width: 100%; background-color: #ddd; border-radius: 10px; margin-top: 20px; height: 20px; }
    #progress-bar { height: 100%; width: 0%; background-color: #4CAF50; border-radius: 10px; transition: width 0.4s ease-in-out; }
    #score-display { font-size: 20px; font-weight: 600; margin-top: 12px; }
    .repere { outline: 4px solid #e22; outline-offset: 2px; border-radius: 8px; }
  </style>
  <link rel="stylesheet" href="notation-adapter.css">
  <link rel="stylesheet" href="../notalix-theme.css">
  <script defer src="../notalix-shell.js"></script>
</head>
<body>
  <h1>Lecture de Notes Express</h1>

  <div class="section">
    <div class="section-topbar">
      <a class="home-link" href="index.html" aria-label="Revenir à l'accueil">🏠 Accueil</a>
    </div>

    <h2 style="color: red;">Défi Sol — progression N1 → N5</h2>

    <!-- Intro repères (mêmes visuels que tes niveaux) -->
    <div id="note-reference">
      <h2>Voici les quatre notes repères :</h2>
      <div class="note"><img alt="Sol4" src="note:sol:G4"/><p>Sol</p></div>
      <div class="note"><img alt="Do4" src="note:sol:C4"/><p>Do</p></div>
      <div class="note"><img alt="Do5" src="note:sol:C5"/><p>Do</p></div>
      <div class="note"><img alt="La5" src="note:sol:A5"/><p>La</p></div>
      <button class="button" id="start-quiz">Commencer le Défi</button>
      <p style="margin-top: 10px; font-size: 14px; color: #555;">
        💡 Astuce : clavier = C D E F G A B (Do Ré Mi Fa Sol La Si)
      </p>
    </div>

    <!-- Zone de jeu (IDs identiques à tes niveaux) -->
    <div id="quiz-section" style="display: none;">
      <!-- HUD compact : titre + stepper + chrono + barre + coeurs -->
<div id="hud2" style="margin:8px 0">
  <div id="level-title" style="font-weight:700; font-size:18px;"></div>
  <div id="level-steps" aria-hidden="true" style="margin:2px 0 8px;"></div>

  <div class="hud-row">
    <div id="time-xxl" class="time-xxl">01:00</div>
    <div id="timebar" class="timebar"><span id="timebar-fill"></span></div>
    <div id="lives-hearts" class="lives-hearts" aria-label="vies">❤️❤️❤️</div>
  </div>
</div>
<div id="note-display"><img alt="Note" id="note-image" src=""/></div>
      <div id="game-container"></div>
      <div id="feedback"></div>
      <div id="progress-container"><div id="progress-bar"></div></div>
      <div id="score-display"></div>
    </div>

    <!-- Fin -->
    <div id="end-buttons" style="display: none;">
      <button class="button" onclick="window.location.href='index.html';">Revenir à l'accueil</button>
    </div>

    <!-- Envoi score (même mécanique que tes niveaux) -->
    <div id="send-score" style="display: none; margin-top: 30px;">
      <h3>Envoyer mon score au professeur</h3>
      <input type="text" id="prenom" placeholder="Prénom" required style="margin: 5px;" />
      <input type="text" id="nom" placeholder="Nom" required style="margin: 5px;" />
      <select id="prof_fm" style="margin: 5px; padding: 5px;">
        <option value="Aucun">FM : Aucun / Non concerné</option>
        <option value="Barbara">Barbara</option>
        <option value="Benoit">Benoit</option>
        <option value="Céline">Céline</option>
        <option value="Chloé">Chloé</option>
        <option value="Frédéric">Frédéric</option>
        <option value="Sandrine">Sandrine</option>
        <option value="Thomas">Thomas</option>
      </select>
      <select id="prof_instrument" style="margin: 5px; padding: 5px;">
        <option value="Aucun">Instrument : Aucun / Non concerné</option>
        <option value="Alexandre">Alexandre</option>
      </select>
      <br>
      <button class="button" onclick="envoyerScore()">Envoyer</button>
      <p id="confirmation" style="margin-top:10px; font-weight: bold;"></p>
      <p id="loading-message" style="display: none; color: blue; font-weight: bold;">⏳ Envoi en cours...</p>
    </div>
  </div>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <script src="config.js"></script>
  <script src="defi_sol.js"></script>
  <script src="vendor/vexflow.js"></script>
  <script src="note-renderer.js"></script>
  <script src="notation-adapter.js"></script>
</body>
</html>
