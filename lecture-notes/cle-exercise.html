<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lecture des clés — NOTALIX</title>
<link rel="stylesheet" href="unified.css?v=0.6.0-0806h"><link rel="stylesheet" href="instrument.css?v=0.6.0-0806h"><link rel="stylesheet" href="cle-exercise.css?v=0.6.0-0806h"><link rel="stylesheet" href="../notalix-theme.css?v=0.6.0-0806d">
<script defer src="../notalix-shell.js"></script></head>
<body><main class="instrument-card key-card">
<a class="home-link" href="index.html?mode=cle">← Retour aux clés</a>
<h2 id="key-title">Lecture des clés</h2><p id="key-purpose" class="pedagogy"></p>
<section id="key-reminder" class="open-strings-intro" hidden><p class="intro-kicker">Avant de commencer</p><h3 id="reminder-title"></h3><div id="reminder-staff" class="open-strings-list combined-staff"></div><button id="start-key" class="button" type="button">Commencer l’exercice</button></section>
<section id="key-quiz" hidden><div id="challenge-hud" class="challenge-hud" hidden><div><span id="challenge-round"></span><div id="challenge-steps" class="challenge-steps"></div></div><div class="challenge-clock"><strong id="challenge-time"></strong><span><i id="challenge-time-fill"></i></span></div><strong id="challenge-hearts"></strong><small id="challenge-recovery"></small></div><p id="clef-badge" class="clef-badge"></p><div class="music-panel"><div id="key-note" class="instrument-note"></div></div><div id="key-answers" class="instrument-answers"></div><p class="keyboard-hint">⌨️ Clavier&nbsp;: C D E F G A B = Do Ré Mi Fa Sol La Si</p><p id="key-feedback" class="instrument-feedback"></p><div class="instrument-progress"><div id="key-progress"></div></div><p id="key-score"></p></section>
<section id="key-result" class="result-panel" hidden>
  <span class="result-symbol" aria-hidden="true">✓</span>
  <p class="result-kicker">Exercice terminé</p>
  <h2 id="key-result-title"></h2>
  <strong id="key-result-score" class="result-score"></strong>
  <p id="key-result-text"></p>
  <div class="result-actions"><button id="key-restart" class="button">Recommencer</button><a id="key-result-home" class="button secondary" href="index.html?mode=cle">Choisir un autre exercice</a></div>
  <details id="key-send-score" class="result-share">
    <summary>Envoyer volontairement mon résultat</summary>
    <p>Rien n’est envoyé sans cliquer sur le bouton ci-dessous.</p>
    <div class="send-score-fields">
      <input type="text" id="key-prenom" placeholder="Prénom" autocomplete="given-name">
      <input type="text" id="key-nom" placeholder="Nom" autocomplete="family-name">
      <select id="key-prof-fm"><option value="Aucun">Professeur de FM (facultatif)</option><option>Barbara</option><option>Benoit</option><option>Céline</option><option>Chloé</option><option>Frédéric</option><option>Sandrine</option><option>Thomas</option></select>
      <select id="key-prof-instrument"><option value="Aucun">Professeur d’instrument (facultatif)</option><option>Alexandre</option></select>
    </div>
    <button id="key-send-button" class="button" type="button">Envoyer mon résultat</button>
    <p id="key-send-confirmation" class="send-confirmation" aria-live="polite"></p>
  </details>
</section>
</main><script src="config.js?v=0.6.0-0806d"></script><script src="vendor/vexflow.js?v=0.6.0-0806d"></script><script src="note-renderer.js?v=0.6.0-0806h"></script><script src="cle-config.js?v=0.6.0-0806h"></script><script src="cle-exercise.js?v=0.6.0-0806h"></script></body></html>
