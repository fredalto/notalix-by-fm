<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dictée Rythmique Express — NOTALIX by FM</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="../notalix-theme.css"><script defer src="../notalix-shell.js"></script></head><body><main><h1>Dictée Rythmique Express</h1><section class="section"><div id="home" class="screen show"><p class="mini">Écoute le rythme, puis reconstruis la mesure avec les briques.</p><h2>Choisis ton niveau</h2><div class="grid"><div class="card" data-level="1"><strong>Niveau 1</strong>Noires et deux croches</div><div class="card" data-level="2"><strong>Niveau 2</strong>+ silences et blanches</div><div class="card" data-level="3"><strong>Niveau 3</strong>+ doubles croches</div><div class="card" data-level="4"><strong>Niveau 4</strong>Rythmes pointés</div></div><button id="start" class="red" disabled>On y va 🚀</button></div><div id="game" class="screen"><div class="topbar"><button id="back" class="gray">← Choix du niveau</button><span id="count" class="pill"></span></div><div class="hud"><span id="score" class="pill">Score 0</span><div class="progress"><span id="bar"></span></div></div><h2>Reconstitue la mesure <span id="beat" class="metronome"></span></h2><button id="listen">▶ Écouter</button><div id="measure" class="measure"></div><div id="palette" class="palette"></div><button id="undo" class="gray">↶ Effacer</button><button id="check" class="red">Vérifier</button><div id="feedback" class="feedback"></div><button id="next" class="blue hidden">Question suivante 🚀</button></div><div id="results" class="screen"><h2>Résultat</h2><div id="result" class="result"></div><p id="message"></p><button id="again">Rejouer</button><button id="homeBtn" class="red">Choisir un autre niveau</button></div></section></main><script src="app.js"></script></body></html>
